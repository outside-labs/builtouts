[project]
name = "builtouts"
version = "0.1.0"
description = "Dependency-free interfaces and conventions built on Python's standard library"
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["html", "parser", "concurrency", "stdlib", "conventions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/outside-labs/builtouts"
Repository = "https://github.com/outside-labs/builtouts"
Issues = "https://github.com/outside-labs/builtouts/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "examples/**", "scripts/**", "CHANGELOG.md", "IMPLEMENTATION_PLAN.md"]
